            ]
        };

        let allProducts = [];
        Object.keys(rawCategories).forEach(cat => {
            rawCategories[cat].forEach(item => {
                allProducts.push({
                    ...item,
                    category: cat,
                    // Dynamic Affiliate Link Generation
                    link: `https://www.amazon.com/dp/${item.asin}?tag=${AFFILIATE_TAG}`
                });
            });
        });

        let currentTab = 'all';

        function renderProducts(items) {
            const container = document.getElementById('productContainer');
            const countHeader = document.getElementById('productCountHeader');
            container.innerHTML = '';
            countHeader.innerText = `Showing ${items.length} product(s)`;

            if (items.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-sm">No matching products found.</div>`;
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = "product-card bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex gap-4 items-center relative overflow-hidden";
                
                card.innerHTML = `
                    <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-xl bg-slate-50 border border-slate-100 flex items-center justify-center overflow-hidden shrink-0 relative">
                        <img src="${item.img}" alt="${item.name}" loading="lazy" class="w-full h-full object-contain p-1.5 hover:scale-105 transition-transform duration-300" 
                            onerror="this.onerror=null; this.src='https://via.placeholder.com/150?text=Eco-Smart';">
                    </div>

                    <div class="flex-1 min-w-0 flex flex-col justify-between h-full space-y-1.5">
                        <div>
                            ${item.badge ? `<span class="inline-block px-2 py-0.5 bg-emerald-100 text-emerald-800 text-[10px] font-bold rounded-md mb-1">${item.badge}</span>` : ''}
                            <h3 class="font-bold text-slate-900 text-xs sm:text-sm leading-snug line-clamp-2 hover:text-emerald-700 transition">${item.name}</h3>
                        </div>

                        <div class="flex items-center gap-2 text-[11px] text-slate-500">
                            <span class="flex items-center gap-1 text-amber-500 font-bold">
                                <i data-lucide="star" class="w-3.5 h-3.5 fill-amber-400 stroke-amber-400"></i> ${item.rating}
                            </span>
                            <span class="text-slate-300">•</span>
                            <span class="text-slate-600 font-medium flex items-center gap-1">
                                <i data-lucide="shopping-bag" class="w-3 h-3 text-slate-400"></i> ${item.sales}/mo
                            </span>
                        </div>

                        <div class="flex items-center justify-between pt-1 border-t border-slate-100 mt-1">
                            <div>
                                <span class="text-[10px] text-slate-400 block uppercase font-medium">Est. Price</span>
                                <span class="text-sm sm:text-base font-extrabold text-emerald-800">$${item.price.toFixed(2)}</span>
                            </div>
                            
                            <a href="${item.link}" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 px-3.5 py-1.8 bg-emerald-800 hover:bg-emerald-900 active:scale-95 text-white font-bold text-xs rounded-xl shadow-sm transition-all">
                                <span>Check Price</span>
                                <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                            </a>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
        }

        function setTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn shrink-0 px-4 py-2 rounded-xl font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition-all";
            });
            document.getElementById(`tab-${tab}`).className = "tab-btn shrink-0 px-4 py-2 rounded-xl font-bold bg-emerald-800 text-white shadow-md transition-all";
            filterProducts();
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProducts.filter(p => {
                const matchesTab = currentTab === 'all' || p.category === currentTab;
                const matchesSearch = p.name.toLowerCase().includes(query) || p.asin.toLowerCase().includes(query);
                return matchesTab && matchesSearch;
            });
            renderProducts(filtered);
        }

        renderProducts(allProducts);
    </script>
