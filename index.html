<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco-Smart Living | Bio Link Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <meta name="referrer" content="no-referrer">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F7F5EE; color: #2B342B; }
        .product-card {
            background: #FFFFFF;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -6px rgba(0, 0, 0, 0.08);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen pb-16 antialiased">

    <!-- Header Section -->
    <header class="max-w-4xl mx-auto px-4 pt-10 text-center">
        <!-- Logo Header -->
        <div class="relative inline-block mb-3">
            <div class="w-24 h-24 rounded-full bg-[#EBE7DC] border-4 border-white shadow-md overflow-hidden flex items-center justify-center mx-auto">
                <img src="logo.png" alt="Eco-Smart Living Logo" onerror="this.onerror=null; this.src='https://api.iconify.design/lucide:home.svg?color=%234E8752';" class="w-full h-full object-cover">
            </div>
            <span class="absolute bottom-0 right-0 bg-[#4E8752] text-white p-1 rounded-full border-2 border-white shadow">
                <i data-lucide="check" class="w-3.5 h-3.5 stroke-[3]"></i>
            </span>
        </div>

        <h1 class="text-3xl font-extrabold text-[#2B342B] tracking-tight">Eco-Smart Living</h1>
        <p class="text-sm font-medium text-slate-500 mt-1">Smart Choices • Minimalist & Eco-Friendly Home Solutions</p>

        <!-- Price Notice Banner -->
        <div class="mt-4 max-w-2xl mx-auto p-3.5 bg-amber-50/90 border border-amber-200/90 rounded-2xl text-left text-xs text-amber-900 flex items-start gap-3 shadow-sm">
            <i data-lucide="info" class="w-4 h-4 text-amber-600 shrink-0 mt-0.5"></i>
            <div>
                <strong>Price Notice:</strong> Product prices are subject to change depending on supplier promotions. Click <strong>"Check Price"</strong> to view real-time deals on Amazon.
            </div>
        </div>

        <!-- Search Bar & Category Tabs Container -->
        <div class="mt-6 max-w-2xl mx-auto space-y-3.5">
            <div class="relative">
                <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="Search products, keywords (e.g. Bamboo, Desk)..." 
                    class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-[#4E8752] shadow-sm">
                <i data-lucide="search" class="w-5 h-5 text-slate-400 absolute left-4 top-3.5"></i>
            </div>
            
            <!-- Category Tabs Navigation -->
            <div id="tabsWrapper" class="flex items-center justify-start sm:justify-center gap-2 overflow-x-auto text-xs no-scrollbar py-2 px-2 max-w-full rounded-2xl bg-[#EBE7DC]/60 border border-slate-200/50">
                <button onclick="setTab('kitchen')" id="tab-kitchen" class="tab-btn shrink-0 px-4 py-2 rounded-xl font-bold bg-[#4E8752] text-white shadow-md">Eco Kitchen (20)</button>
                <button onclick="setTab('workspace')" id="tab-workspace" class="tab-btn shrink-0 px-4 py-2 rounded-xl font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50">Smart Workspace (20)</button>
                <button onclick="setTab('closet')" id="tab-closet" class="tab-btn shrink-0 px-4 py-2 rounded-xl font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50">Smart Closet (20)</button>
                <button onclick="setTab('cleaning')" id="tab-cleaning" class="tab-btn shrink-0 px-4 py-2 rounded-xl font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50">Laundry & Eco (20)</button>
                <button onclick="setTab('storage')" id="tab-storage" class="tab-btn shrink-0 px-4 py-2 rounded-xl font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50">Smart Storage (20)</button>
            </div>
        </div>
    </header>

    <!-- Main Grid -->
    <main class="max-w-4xl mx-auto px-4 mt-8">
        <div class="flex items-center justify-between mb-4 px-1">
            <span id="productCountHeader" class="text-xs font-bold uppercase tracking-wider text-slate-400">Showing 20 products</span>
        </div>

        <div id="productContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
    </main>

    <script>
        const AFFILIATE_TAG = "ecosmart0f5-20";

        // Multi-level image URL resolver & clean fallback
        function handleImgError(imgElement, secondaryUrl, title) {
            if (imgElement.getAttribute('data-tried-secondary') !== 'true' && secondaryUrl && secondaryUrl.startsWith('http')) {
                imgElement.setAttribute('data-tried-secondary', 'true');
                imgElement.src = secondaryUrl;
            } else {
                imgElement.onerror = null;
                const parent = imgElement.parentElement;
                parent.innerHTML = `<div class="w-full h-full bg-[#EBE7DC]/60 flex flex-col items-center justify-center text-center p-2 text-slate-400">
                    <i data-lucide="package" class="w-8 h-8 text-[#4E8752] mb-1"></i>
                    <span class="text-[10px] font-semibold text-slate-500 line-clamp-1">${title.split(' ')[0]}</span>
                </div>`;
                lucide.createIcons();
            }
        }

        function renderProducts(items) {
            const container = document.getElementById('productContainer');
            const countHeader = document.getElementById('productCountHeader');
            container.innerHTML = '';
            countHeader.innerText = `Showing ${items.length} product(s)`;

            if (items.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-sm">No matching products found.</div>`;
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = "product-card p-4 rounded-2xl border border-slate-200/80 shadow-sm flex gap-4 items-center relative overflow-hidden";
                const affLink = `https://www.amazon.com/dp/${item.asin}?tag=${AFFILIATE_TAG}`;
                
                card.innerHTML = `
                    <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-xl bg-[#FAF8F5] border border-slate-100 flex items-center justify-center overflow-hidden shrink-0 relative">
                        <img src="${item.img_primary}" alt="${item.title}" loading="lazy" referrerpolicy="no-referrer" class="w-full h-full object-contain p-1.5 hover:scale-105 transition-transform duration-300" 
                            onerror="handleImgError(this, '${item.img_secondary}', '${item.title.replace(/'/g, "")}')">
                    </div>

                    <div class="flex-1 min-w-0 flex flex-col justify-between h-full space-y-1.5">
                        <div>
                            <span class="inline-block px-2 py-0.5 bg-emerald-100 text-emerald-800 text-[10px] font-bold rounded-md mb-1">⭐ Verified Eco Item</span>
                            <h3 class="font-bold text-slate-900 text-xs sm:text-sm leading-snug line-clamp-2 hover:text-[#4E8752] transition">${item.title}</h3>
                        </div>

                        <div class="flex items-center gap-2 text-[11px] text-slate-500">
                            <span class="flex items-center gap-1 text-amber-500 font-bold">
                                <i data-lucide="star" class="w-3.5 h-3.5 fill-amber-400 stroke-amber-400"></i> ${item.rating}
                            </span>
                            <span class="text-slate-300">•</span>
                            <span class="text-slate-600 font-medium flex items-center gap-1">
                                <i data-lucide="shopping-bag" class="w-3 h-3 text-slate-400"></i> ${item.sales}/mo
                            </span>
                        </div>

                        <div class="flex items-center justify-between pt-1 border-t border-slate-100 mt-1">
                            <div>
                                <span class="text-[10px] text-slate-400 block uppercase font-medium">Est. Price</span>
                                <span class="text-sm sm:text-base font-extrabold text-[#4E8752]">$${parseFloat(item.price).toFixed(2)}</span>
                            </div>
                            
                            <a href="${affLink}" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 px-3.5 py-1.8 bg-[#4E8752] hover:bg-[#3D6E40] active:scale-95 text-white font-bold text-xs rounded-xl shadow-sm transition-all">
                                <span>Check Price</span>
                                <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                            </a>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
        }

        // Search & Tab Functions
        function setTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn shrink-0 px-4 py-2 rounded-xl font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition-all";
            });
            document.getElementById(`tab-${tab}`).className = "tab-btn shrink-0 px-4 py-2 rounded-xl font-bold bg-[#4E8752] text-white shadow-md transition-all";
            filterProducts();
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const items = rawCategories[currentTab] || [];
            const filtered = items.filter(p => p.title.toLowerCase().includes(query) || p.asin.toLowerCase().includes(query));
            renderProducts(filtered);
        }

        // Mouse drag scrolling for tabs on PC
        const slider = document.getElementById('tabsWrapper');
        let isDown = false, startX, scrollLeft;
        slider.addEventListener('mousedown', (e) => { isDown = true; startX = e.pageX - slider.offsetLeft; scrollLeft = slider.scrollLeft; });
        slider.addEventListener('mouseleave', () => isDown = false);
        slider.addEventListener('mouseup', () => isDown = false);
        slider.addEventListener('mousemove', (e) => {
            if(!isDown) return;
            e.preventDefault();
            const x = e.pageX - slider.offsetLeft;
            slider.scrollLeft = scrollLeft - (x - startX) * 2;
        });

        // Initial Render
        renderProducts(rawCategories['kitchen']);
    </script>
</body>
</html>
