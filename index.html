<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco-Smart Living | Bio Link Hub</title>
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid #E2E8F0; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- Header & Bio Section -->
    <header class="max-w-2xl mx-auto px-4 pt-8 text-center">
        <div class="w-20 h-20 rounded-full bg-emerald-800 text-white text-3xl font-bold flex items-center justify-center mx-auto mb-3 shadow-md">🌱</div>
        <h1 class="text-2xl font-bold text-slate-900">Eco-Smart Living</h1>
        <p class="text-sm text-slate-500 mt-1">Sống Gọn & Thông Minh • Giải Pháp Tối Ưu Không Gian</p>

        <!-- Dynamic Price Fluctuation Notice -->
        <div class="mt-4 p-3 bg-amber-50 border border-amber-200 rounded-xl text-left text-xs text-amber-800 flex items-start gap-2 shadow-sm">
            <i data-lucide="info" class="w-4 h-4 text-amber-600 shrink-0 mt-0.5"></i>
            <div>
                <strong>Lưu ý về giá:</strong> Mức giá niêm yết dưới đây có thể điều chỉnh tùy thuộc vào chương trình ưu đãi của Nhà cung cấp. Nhấp vào <strong>"Xem sản phẩm"</strong> để cập nhật giá chi tiết nhất!
            </div>
        </div>

        <!-- Search Bar & Tab Filters -->
        <div class="mt-5 space-y-3">
            <div class="relative">
                <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="Tìm sản phẩm (ví dụ: thớt tre, bàn nâng hạ)..." 
                    class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600 shadow-sm">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3"></i>
            </div>
            
            <div class="flex items-center justify-center gap-1.5 overflow-x-auto text-xs">
                <button onclick="setTab('all')" id="tab-all" class="tab-btn px-3 py-1.5 rounded-lg font-semibold bg-emerald-800 text-white shadow-sm">Tất Cả (20)</button>
                <button onclick="setTab('bep')" id="tab-bep" class="tab-btn px-3 py-1.5 rounded-lg font-semibold bg-white text-slate-600 border hover:bg-slate-50">Bếp Xanh Eco</button>
                <button onclick="setTab('desk')" id="tab-desk" class="tab-btn px-3 py-1.5 rounded-lg font-semibold bg-white text-slate-600 border hover:bg-slate-50">Góc Làm Việc</button>
                <button onclick="setTab('todo')" id="tab-todo" class="tab-btn px-3 py-1.5 rounded-lg font-semibold bg-white text-slate-600 border hover:bg-slate-50">Sống Gọn Tủ Đồ</button>
            </div>
        </div>
    </header>

    <!-- Product Feed Container -->
    <main class="max-w-2xl mx-auto px-4 mt-6">
        <div id="productContainer" class="space-y-3"></div>
    </main>

    <script>
        // Array containing 20 Eco-Smart Products with Ratings & Sales
        const products = [
            { id: 1, category: 'bep', name: 'Thớt tre khay đựng gạt nước Astercook (Bamboo Board)', price: 24.99, rating: 4.5, sales: '20,000+', link: 'https://www.amazon.com/dp/B0FH6YL3XC', badge: '🔥 Best Seller' },
            { id: 2, category: 'bep', name: 'Khay phân chia ngăn kéo gỗ tre Besilord', price: 12.98, rating: 4.6, sales: '10,000+', link: 'https://www.amazon.com/dp/B0BTKFQM5R', badge: '⭐ Khuyên Dùng' },
            { id: 3, category: 'bep', name: 'Thanh chia ngăn kéo mở rộng SpaceAid Bamboo', price: 22.37, rating: 4.4, sales: '7,000+', link: 'https://www.amazon.com/dp/B094624Q8Z' },
            { id: 4, category: 'bep', name: 'Khăn lau bếp bọt biển xơ dừa Isshah (12 Pack)', price: 7.99, rating: 4.5, sales: '6,000+', link: 'https://www.amazon.com/dp/B0CSBG92MF' },
            { id: 5, category: 'bep', name: 'Miếng chùi rửa Skoy Scrub Eco-Friendly (4 Pack)', price: 9.99, rating: 4.7, sales: '1,000+', link: 'https://www.amazon.com/dp/B0CCHWSZ88' },
            { id: 6, category: 'bep', name: 'Túi đi chợ gấp gọn Eco Chic Grocery Bag', price: 16.14, rating: 4.6, sales: '1,000+', link: 'https://www.amazon.com/dp/B082XR8HVB' },
            { id: 7, category: 'bep', name: 'Bao tay cao su thiên nhiên lót bông If You Care', price: 6.78, rating: 4.4, sales: '1,000+', link: 'https://www.amazon.com/dp/B00E1DCROE' },
            { id: 8, category: 'bep', name: 'Túi silicon bảo quản thực phẩm Stasher', price: 8.38, rating: 4.6, sales: '1,000+', link: 'https://www.amazon.com/dp/B06XPJT4CR' },
            { id: 9, category: 'bep', name: 'Hộp hũ thủy tinh nắp gỗ tre LIBWYS (Bộ 12)', price: 44.99, rating: 4.2, sales: '500+', link: 'https://www.amazon.com/dp/B0D7CPXZPK' },
            { id: 10, category: 'bep', name: 'Kệ gỗ tre lưu trữ đa năng 6 tầng FOTOSOK', price: 63.49, rating: 4.7, sales: '300+', link: 'https://www.amazon.com/dp/B09WKN7477' },
            { id: 11, category: 'desk', name: 'Bàn nâng hạ điện thông minh Claiks Desk', price: 59.98, rating: 4.2, sales: '600+', link: 'https://www.amazon.com/dp/B0H45TV33J', badge: '💻 Workspace' },
            { id: 12, category: 'desk', name: 'Bàn làm việc gấp gọn Huuger Foldable 31.5"', price: 56.99, rating: 4.4, sales: '1,000+', link: 'https://www.amazon.com/dp/B0F43TL3GT' },
            { id: 13, category: 'desk', name: 'Đèn LED kẹp bàn bảo vệ mắt Motumen', price: 21.99, rating: 4.6, sales: '2,000+', link: 'https://www.amazon.com/dp/B0D4DG2CG2' },
            { id: 14, category: 'desk', name: 'Đèn LED đôi kẹp màn hình chống mỏi mắt', price: 49.99, rating: 4.6, sales: '3,000+', link: 'https://www.amazon.com/dp/B0BRCJL4MM' },
            { id: 15, category: 'desk', name: 'Khay kẹp bàn di chuột xoay 360° Clamp-on', price: 26.99, rating: 4.3, sales: '200+', link: 'https://www.amazon.com/dp/B072JLB1DP' },
            { id: 16, category: 'todo', name: 'Móc treo quần yoga/Legging Volnamal', price: 9.99, rating: 4.4, sales: '10,000+', link: 'https://www.amazon.com/dp/B0BZCBJ7RL', badge: '⚡ Tiết Kiệm' },
            { id: 17, category: 'todo', name: 'Móc treo quần inox chống trượt 5 tầng', price: 9.98, rating: 4.4, sales: '9,000+', link: 'https://www.amazon.com/dp/B0CYX497CJ' },
            { id: 18, category: 'todo', name: 'Móc treo quần áo đa năng xếp gọn Wonder Hanger', price: 26.98, rating: 4.7, sales: '9,000+', link: 'https://www.amazon.com/dp/B07GYLFFVR' },
            { id: 19, category: 'todo', name: 'Giỏ nhựa xếp chồng đựng quần áo closet', price: 28.79, rating: 4.5, sales: '6,000+', link: 'https://www.amazon.com/dp/B0CHVKCWS7' },
            { id: 20, category: 'todo', name: 'Móc gỗ treo áo dây/bra NECAMOCU', price: 7.98, rating: 4.6, sales: '5,000+', link: 'https://www.amazon.com/dp/B0DQ67STGL' }
        ];

        let currentTab = 'all';

        function renderProducts(items) {
            const container = document.getElementById('productContainer');
            container.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = "glass-card p-4 rounded-2xl shadow-sm hover:shadow-md transition flex flex-col sm:flex-row sm:items-center justify-between gap-3";
                card.innerHTML = `
                    <div class="space-y-1 flex-1">
                        ${item.badge ? `<span class="inline-block px-2 py-0.5 bg-emerald-100 text-emerald-800 text-[10px] font-bold rounded-full mb-1">${item.badge}</span>` : ''}
                        <h3 class="font-bold text-slate-900 text-sm leading-snug">${item.name}</h3>
                        <div class="flex items-center gap-3 text-xs text-slate-500 pt-0.5">
                            <span class="flex items-center gap-1 text-amber-500 font-semibold"><i data-lucide="star" class="w-3.5 h-3.5 fill-amber-400 stroke-amber-400"></i> ${item.rating}</span>
                            <span>•</span>
                            <span class="flex items-center gap-1"><i data-lucide="shopping-bag" class="w-3.5 h-3.5 text-slate-400"></i> Đã bán ${item.sales}/tháng</span>
                        </div>
                    </div>
                    <div class="flex items-center justify-between sm:justify-end gap-3 pt-2 sm:pt-0 border-t sm:border-0 border-slate-100">
                        <div class="text-left sm:text-right">
                            <span class="text-[10px] text-slate-400 block">Giá từ</span>
                            <span class="text-base font-extrabold text-emerald-800">$${item.price.toFixed(2)}</span>
                        </div>
                        <a href="${item.link}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 px-4 py-2 bg-emerald-800 hover:bg-emerald-900 text-white font-semibold text-xs rounded-xl shadow-sm transition">
                            <span>Xem SP</span>
                            <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
        }

        function setTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.className = "tab-btn px-3 py-1.5 rounded-lg font-semibold bg-white text-slate-600 border hover:bg-slate-50");
            document.getElementById(`tab-${tab}`).className = "tab-btn px-3 py-1.5 rounded-lg font-semibold bg-emerald-800 text-white shadow-sm";
            filterProducts();
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => (currentTab === 'all' || p.category === currentTab) && p.name.toLowerCase().includes(query));
            renderProducts(filtered);
        }

        renderProducts(products);
    </script>
</body>
</html>
