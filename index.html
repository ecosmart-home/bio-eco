        let currentTab = 'kitchen';

        // Safe DOM Creation Renderer
        function renderProducts(items) {
            const container = document.getElementById('productContainer');
            const countHeader = document.getElementById('productCountHeader');
            if (!container) return;
            
            container.innerHTML = '';
            if (countHeader) countHeader.innerText = `Showing ${items ? items.length : 0} product(s)`;

            if (!items || items.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-sm">No matching products found.</div>`;
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = "product-card p-4 rounded-2xl border border-slate-200/80 shadow-sm flex gap-4 items-center relative overflow-hidden";
                const affLink = `https://www.amazon.com/dp/${item.asin}?tag=${AFFILIATE_TAG}`;
                const priceVal = parseFloat(item.price) || 24.99;
                
                // 1. Image Box
                const imgBox = document.createElement('div');
                imgBox.className = "w-24 h-24 sm:w-28 sm:h-28 rounded-xl bg-[#FAF8F5] border border-slate-100 flex items-center justify-center overflow-hidden shrink-0 relative";
                
                const imgEl = document.createElement('img');
                imgEl.src = item.img;
                imgEl.alt = item.title;
                imgEl.loading = "lazy";
                imgEl.referrerPolicy = "no-referrer";
                imgEl.className = "w-full h-full object-contain p-1.5 hover:scale-105 transition-transform duration-300";
                
                imgEl.onerror = function() {
                    const fallbackUrl = `https://images-na.ssl-images-amazon.com/images/P/${item.asin}.01._SCLZZZZZZZ_SX320_.jpg`;
                    if (this.getAttribute('data-tried') !== 'true') {
                        this.setAttribute('data-tried', 'true');
                        this.src = fallbackUrl;
                    } else {
                        this.onerror = null;
                        this.parentElement.innerHTML = `<div class="w-full h-full bg-[#EBE7DC]/60 flex flex-col items-center justify-center text-center p-2 text-slate-400">
                            <i data-lucide="package" class="w-8 h-8 text-[#4E8752] mb-1"></i>
                            <span class="text-[10px] font-semibold text-slate-500 line-clamp-1">Eco Item</span>
                        </div>`;
                        if (window.lucide) lucide.createIcons();
                    }
                };
                imgBox.appendChild(imgEl);

                // 2. Details Box
                const detailsBox = document.createElement('div');
                detailsBox.className = "flex-1 min-w-0 flex flex-col justify-between h-full space-y-1.5";
                
                const badge = document.createElement('span');
                badge.className = "inline-block px-2 py-0.5 bg-emerald-100 text-emerald-800 text-[10px] font-bold rounded-md mb-1";
                badge.textContent = "⭐ Verified Eco Item";

                const titleHeading = document.createElement('h3');
                titleHeading.className = "font-bold text-slate-900 text-xs sm:text-sm leading-snug line-clamp-2 hover:text-[#4E8752] transition";
                titleHeading.textContent = item.title;

                const metaDiv = document.createElement('div');
                metaDiv.className = "flex items-center gap-2 text-[11px] text-slate-500";
                metaDiv.innerHTML = `
                    <span class="flex items-center gap-1 text-amber-500 font-bold">
                        <i data-lucide="star" class="w-3.5 h-3.5 fill-amber-400 stroke-amber-400"></i> ${item.rating}
                    </span>
                    <span class="text-slate-300">•</span>
                    <span class="text-slate-600 font-medium flex items-center gap-1">
                        <i data-lucide="shopping-bag" class="w-3 h-3 text-slate-400"></i> ${item.sales}/mo
                    </span>
                `;

                const priceCtaDiv = document.createElement('div');
                priceCtaDiv.className = "flex items-center justify-between pt-1 border-t border-slate-100 mt-1";
                priceCtaDiv.innerHTML = `
                    <div>
                        <span class="text-[10px] text-slate-400 block uppercase font-medium">Est. Price</span>
                        <span class="text-sm sm:text-base font-extrabold text-[#4E8752]">$${priceVal.toFixed(2)}</span>
                    </div>
                    
                    <a href="${affLink}" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 px-3.5 py-1.8 bg-[#4E8752] hover:bg-[#3D6E40] active:scale-95 text-white font-bold text-xs rounded-xl shadow-sm transition-all">
                        <span>Check Price</span>
                        <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                    </a>
                `;

                const topDiv = document.createElement('div');
                topDiv.appendChild(badge);
                topDiv.appendChild(titleHeading);

                detailsBox.appendChild(topDiv);
                detailsBox.appendChild(metaDiv);
                detailsBox.appendChild(priceCtaDiv);

                card.appendChild(imgBox);
                card.appendChild(detailsBox);
                container.appendChild(card);
            });
            if (window.lucide) lucide.createIcons();
        }

        function setTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn shrink-0 px-4 py-2 rounded-xl font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition-all";
            });
            const activeBtn = document.getElementById(`tab-${tab}`);
            if (activeBtn) activeBtn.className = "tab-btn shrink-0 px-4 py-2 rounded-xl font-bold bg-[#4E8752] text-white shadow-md transition-all";
            filterProducts();
        }

        function filterProducts() {
            const searchEl = document.getElementById('searchInput');
            const query = searchEl ? searchEl.value.toLowerCase() : '';
            const items = rawCategories[currentTab] || [];
            const filtered = items.filter(p => (p.title || '').toLowerCase().includes(query) || (p.asin || '').toLowerCase().includes(query));
            renderProducts(filtered);
        }

        // Mouse drag scrolling for tabs on PC
        window.addEventListener('DOMContentLoaded', () => {
            const slider = document.getElementById('tabsWrapper');
            if (slider) {
                let isDown = false, startX, scrollLeft;
                slider.addEventListener('mousedown', (e) => { isDown = true; startX = e.pageX - slider.offsetLeft; scrollLeft = slider.scrollLeft; });
                slider.addEventListener('mouseleave', () => isDown = false);
                slider.addEventListener('mouseup', () => isDown = false);
                slider.addEventListener('mousemove', (e) => {
                    if(!isDown) return;
                    e.preventDefault();
                    const x = e.pageX - slider.offsetLeft;
                    slider.scrollLeft = scrollLeft - (x - startX) * 2;
                });
            }
            renderProducts(rawCategories['kitchen']);
        });
    </script>
