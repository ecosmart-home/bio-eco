        function renderProducts(items) {
            const container = document.getElementById('productContainer');
            const countHeader = document.getElementById('productCountHeader');
            container.innerHTML = '';
            countHeader.innerText = `Showing ${items.length} product(s)`;

            if (items.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-400 text-sm">No matching products found.</div>`;
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = "glass-card p-4 rounded-2xl shadow-sm hover:shadow-md transition flex flex-col sm:flex-row sm:items-center justify-between gap-3";
                
                card.innerHTML = `

                            <span class="text-base font-extrabold text-emerald-800">$${item.price.toFixed(2)}</span>
                        </div>
                        <a href="${item.link}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 px-4 py-2 bg-emerald-800 hover:bg-emerald-900 text-white font-semibold text-xs rounded-xl shadow-sm transition">

                            <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
        }

        function setTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn shrink-0 px-3.5 py-1.5 rounded-lg font-semibold bg-white text-slate-600 border hover:bg-slate-50 transition";
            });
            document.getElementById(`tab-${tab}`).className = "tab-btn shrink-0 px-3.5 py-1.5 rounded-lg font-semibold bg-emerald-800 text-white shadow-sm transition";
            filterProducts();
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProducts.filter(p => {
                const matchesTab = currentTab === 'all' || p.category === currentTab;
                const matchesSearch = p.name.toLowerCase().includes(query) || p.asin.toLowerCase().includes(query);
                return matchesTab && matchesSearch;
            });
            renderProducts(filtered);
        }

        // Initial Render
        renderProducts(allProducts);
